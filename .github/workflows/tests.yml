name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Bytecode compilation
        run: python -m compileall -q book_skills scripts tests examples/build_sample.py
      - name: Sample pack validation
        run: python scripts/book_skills.py validate examples/sample-pack --json
      - name: Legacy compatibility validation
        run: python scripts/check_pack.py examples/v1-sample-pack --legacy --json
